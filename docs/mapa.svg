<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mapa de lo que queremos hacer: de la ficha al DOI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="regla" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#B26914"/><stop offset="1" stop-color="#137563"/></linearGradient>
<marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#137563"/></marker>
<marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B26914"/></marker>
</defs>
<rect width="1200" height="760" rx="18" fill="#FBF6EE"/>
<!-- anillos sísmicos -->
<g fill="none" stroke="#B26914" opacity=".10" stroke-width="1.5">
<circle cx="1060" cy="90" r="40"/><circle cx="1060" cy="90" r="80"/><circle cx="1060" cy="90" r="120"/><circle cx="1060" cy="90" r="160"/><circle cx="1060" cy="90" r="200"/>
</g>
<!-- título -->
<text x="48" y="58" font-family="Space Grotesk,sans-serif" font-size="30" font-weight="700" fill="#241F19">Mapa: lo que queremos hacer</text>
<rect x="48" y="70" width="140" height="4" rx="2" fill="url(#regla)"/>
<text x="48" y="100" font-family="Spline Sans,sans-serif" font-size="15" fill="#5A5344">Tres hilos, un camino de la ficha al DOI, y un historial que la red puede mostrar.</text>

<!-- TRES HILOS -->
<g font-family="Space Mono,monospace" font-size="11" fill="#B26914" letter-spacing="1">
<text x="48" y="140">LOS TRES HILOS</text>
</g>
<g font-family="Space Grotesk,sans-serif" font-weight="700" font-size="17" fill="#241F19">
<rect x="48" y="152" width="340" height="96" rx="14" fill="#fff" stroke="#E3D8C6" stroke-width="1.5"/>
<circle cx="80" cy="184" r="16" fill="#137563"/><text x="80" y="190" fill="#fff" text-anchor="middle" font-size="15">1</text>
<text x="106" y="189">Las herramientas</text>
<text x="106" y="214" font-family="Spline Sans,sans-serif" font-weight="400" font-size="13" fill="#5A5344">GitHub para proyectos, datos y código.</text>
<text x="106" y="233" font-family="Spline Sans,sans-serif" font-weight="400" font-size="13" fill="#5A5344">Discord como punto de encuentro. Asíncrono.</text>

<rect x="430" y="152" width="340" height="96" rx="14" fill="#fff" stroke="#E3D8C6" stroke-width="1.5"/>
<circle cx="462" cy="184" r="16" fill="#137563"/><text x="462" y="190" fill="#fff" text-anchor="middle" font-size="15">2</text>
<text x="488" y="189">Laboratorio de Ideas</text>
<text x="488" y="214" font-family="Spline Sans,sans-serif" font-weight="400" font-size="13" fill="#5A5344">Veinte fichas de la primera reunión.</text>
<text x="488" y="233" font-family="Spline Sans,sans-serif" font-weight="400" font-size="13" fill="#5A5344">Una plantilla para cada dupla.</text>

<rect x="812" y="152" width="340" height="96" rx="14" fill="#fff" stroke="#E3D8C6" stroke-width="1.5"/>
<circle cx="844" cy="184" r="16" fill="#137563"/><text x="844" y="190" fill="#fff" text-anchor="middle" font-size="15">3</text>
<text x="870" y="189">Conexión RedJIV</text>
<text x="870" y="214" font-family="Spline Sans,sans-serif" font-weight="400" font-size="13" fill="#5A5344">Track de respuesta a los terremotos.</text>
<text x="870" y="233" font-family="Spline Sans,sans-serif" font-weight="400" font-size="13" fill="#5A5344">Seis líneas, A a F, en orden de arranque.</text>
</g>

<!-- EL CAMINO -->
<g font-family="Space Mono,monospace" font-size="11" fill="#B26914" letter-spacing="1">
<text x="48" y="300">EL CAMINO DE CADA RESULTADO</text>
</g>
<!-- flechas -->
<g stroke="#137563" stroke-width="2.5" fill="none" marker-end="url(#flecha)">
<line x1="196" y1="372" x2="236" y2="372"/>
<line x1="384" y1="372" x2="424" y2="372"/>
<line x1="572" y1="372" x2="612" y2="372"/>
<line x1="800" y1="372" x2="840" y2="372"/>
<line x1="988" y1="372" x2="1028" y2="372"/>
</g>
<g font-family="Space Grotesk,sans-serif" font-weight="700" font-size="16" fill="#241F19" text-anchor="middle">
<!-- Persona -->
<rect x="48" y="330" width="148" height="84" rx="14" fill="#D9EFE8" stroke="#137563" stroke-width="2"/>
<text x="122" y="366">Persona</text>
<text x="122" y="390" font-family="Space Mono,monospace" font-weight="400" font-size="10" fill="#137563">ORCID · GitHub · Zenodo</text>
<!-- Ficha -->
<rect x="236" y="330" width="148" height="84" rx="14" fill="#fff" stroke="#E3D8C6" stroke-width="1.5"/>
<text x="310" y="366">Ficha</text>
<text x="310" y="390" font-family="Spline Sans,sans-serif" font-weight="400" font-size="12" fill="#5A5344">idea o brecha, dupla</text>
<!-- Issue -->
<rect x="424" y="330" width="148" height="84" rx="14" fill="#fff" stroke="#E3D8C6" stroke-width="1.5"/>
<text x="498" y="366">Issue</text>
<text x="498" y="390" font-family="Spline Sans,sans-serif" font-weight="400" font-size="12" fill="#5A5344">tarea en el tablero</text>
<!-- Repositorio -->
<rect x="612" y="330" width="188" height="84" rx="14" fill="#fff" stroke="#E3D8C6" stroke-width="1.5"/>
<text x="706" y="362">Repositorio</text>
<text x="706" y="382" font-family="Spline Sans,sans-serif" font-weight="400" font-size="12" fill="#5A5344">privado mientras se trabaja</text>
<text x="706" y="398" font-family="Spline Sans,sans-serif" font-weight="400" font-size="12" fill="#5A5344">público cuando la dupla decide</text>
<!-- Release -->
<rect x="840" y="330" width="148" height="84" rx="14" fill="#fff" stroke="#E3D8C6" stroke-width="1.5"/>
<text x="914" y="366">Release</text>
<text x="914" y="390" font-family="Spline Sans,sans-serif" font-weight="400" font-size="12" fill="#5A5344">CITATION.cff, CRediT</text>
<!-- DOI -->
<rect x="1028" y="330" width="124" height="84" rx="14" fill="#137563"/>
<text x="1090" y="366" fill="#fff">DOI</text>
<text x="1090" y="390" font-family="Space Mono,monospace" font-weight="400" font-size="12" fill="#D9EFE8">comunidad RedJIV</text>
</g>
<!-- licencia bajo el camino -->
<g font-family="Space Mono,monospace" font-size="11" fill="#5A5344" text-anchor="middle">
<text x="600" y="444">texto y datos: CC BY-SA 4.0 · código: licencia libre aparte · material ajeno: se atribuye, no se copia</text>
</g>

<!-- DISCORD banda -->
<rect x="48" y="470" width="1104" height="56" rx="14" fill="#241F19"/>
<g font-family="Space Grotesk,sans-serif" font-size="15" fill="#FBF6EE">
<text x="72" y="504" font-weight="700">Discord</text>
<text x="150" y="504" font-family="Spline Sans,sans-serif" font-size="14" fill="#E3D8C6">encuentros quincenales · un canal por línea y por dupla · oportunidades · resultados · ayuda</text>
<text x="1128" y="504" text-anchor="end" font-family="Space Mono,monospace" font-size="12" fill="#E7B15A">cada encuentro es un sprint</text>
</g>

<!-- EVIDENCIA -->
<g font-family="Space Mono,monospace" font-size="11" fill="#B26914" letter-spacing="1">
<text x="48" y="574">LO QUE QUEDA</text>
</g>
<g stroke="#B26914" stroke-width="2.5" fill="none" marker-end="url(#flechaAmbar)" stroke-dasharray="7 6">
<line x1="600" y1="536" x2="600" y2="586"/>
</g>
<rect x="48" y="590" width="1104" height="92" rx="14" fill="#F3E0C8" stroke="#B26914" stroke-width="2"/>
<g font-family="Space Grotesk,sans-serif" font-size="18" font-weight="700" fill="#241F19">
<text x="72" y="624">Evidencia que la red puede mostrar: no empezamos de cero</text>
</g>
<g font-family="Spline Sans,sans-serif" font-size="14" fill="#5A5344">
<text x="72" y="652">historial público de quién hizo qué · resultados con DOI · personas con ORCID · una comunidad activa de sénior, júnior y estudiantes</text>
</g>

<!-- pie -->
<g font-family="Spline Sans,sans-serif" font-size="13" fill="#5A5344">
<text x="48" y="726">Coordinación compartida: co-dueños en GitHub, co-anfitriones en Discord, curadores en Zenodo. Nombrados por la red, relevables.</text>
</g>
<g font-family="Space Mono,monospace" font-size="11" fill="#B26914">
<text x="1152" y="726" text-anchor="end">CC BY-SA 4.0</text>
</g>
</svg>
